[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodirun-so101-wired-teleop"
version = "0.1.0"
description = "Optional wired multi-leader SO-101 teleoperation and episode collection"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
# The arm stack is only needed on the nodes that actually drive hardware; the
# controller and the config tooling stay importable without it.
hardware = ["lerobot>=0.6,<0.7"]
camera = ["opencv-python-headless>=4.10,<5", "numpy>=1.26,<3"]
collect = ["paramiko>=3.4,<5"]
test = ["pytest>=8,<9"]

[project.scripts]
embodirun-so101-leader = "embodirun_so101_wired_teleop.cli:leader_main"
embodirun-so101-follower = "embodirun_so101_wired_teleop.cli:follower_main"
embodirun-so101-collect = "embodirun_so101_wired_teleop.cli:collect_main"

[tool.setuptools.packages.find]
where = ["src"]
