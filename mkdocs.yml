site_name: EmbodiRun
site_description: An Efficient Deployment & Execution Runtime for Embodied AI
site_url: https://embodirun.readthedocs.io/
repo_url: https://github.com/BUAA-CI-LAB/EmbodiRun
repo_name: BUAA-CI-LAB/EmbodiRun
docs_dir: docs
exclude_docs: |
  design/
  requirements.txt

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Support Matrix: support-matrix.md
  - License and relicensing: license.md
  - Control: control.md
  - Safety: safety.md
  - Inference API v1: http_api.md
  - π0.5 Bi-SO-101: pi05-bi-so101.md
  - Experimental:
      - LightNav-0 XLeRobot: lightnav0_xlerobot.md
      - Camera experiments: camera-only-experiments.md
      - Transport experiments: transport-experiments.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
