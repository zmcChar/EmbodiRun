site_name: EmbodiRun
site_description: An Efficient Deployment & Execution Runtime for Embodied AI
site_url: https://embodirun.readthedocs.io/
repo_url: https://github.com/BUAA-CI-LAB/EmbodiRun
repo_name: BUAA-CI-LAB/EmbodiRun
docs_dir: docs
exclude_docs: |
  requirements.txt

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
      - Configuration: configuration.md
  - Operating:
      - Control: control.md
      - Safety: safety.md
      - Support matrix: support-matrix.md
  - Integrating:
      - Inference API v1: http_api.md
      - RPent integration: rpent-integration.md
      - π0.5 with two SO-101: pi05-bi-so101.md
  - Concepts:
      - Architecture: architecture.md
  - Experiments:
      - Overview: experiments.md
      - Camera-only capture: camera-only-experiments.md
      - Transport candidates: transport-experiments.md
      - LightNav-0 with XLeRobot: lightnav0_xlerobot.md
  - Reference:
      - Python API: api.md
  - Project:
      - Contributing: contributing.md
      - Code of Conduct: code-of-conduct.md
      - License and relicensing: license.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
