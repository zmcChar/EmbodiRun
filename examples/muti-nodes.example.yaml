metadata:
  name: thor-so101-pi05
  deploy-commit: e2b4f55e8a215b2be6a8d0bdb212508752e288af
  inference-commit: 5deebca26beab7d13d51f7a6cf25a6ea5ada8c57

nodes:
  jetson-agx-thor-232:
    type: jetson.agx-thor-128gb
    connection:
      type: ssh
      host: 192.168.2.232
      port: 22
      username: operator
      accept_new_host_key: false

robots:
  so101-1:
    type: lerobot.so101
    node: jetson-agx-thor-232
    port: /dev/ttyACM0
    calibration_id: thor_so101_follower
    calibration_dir: /home/user/.cache/huggingface/lerobot/calibration/robots/so_follower
    disable_torque_on_disconnect: true
    max_joint_step_deg: 5.0
    max_gripper_step: 10.0
    step_limit_mode: clip

    sensors:
      observation.images.front:
        type: v4l2
        device: /dev/v4l/by-id/usb-icSpring_icspring_camera_202404160005-video-index0
        width: 640
        height: 480
        fps: 30

      observation.images.wrist:
        type: v4l2
        device: /dev/v4l/by-id/usb-icSpring_icspring_camera-video-index0
        width: 640
        height: 480
        fps: 30

models:
  pi05-01:
    backend: vvla
    transport: http
    type: pi05
    node: jetson-agx-thor-232
    gpu: cuda:0
    environment: .venv-vvla
    environment_index: https://download.pytorch.org/whl/cu130
    environment_packages:
      - torch==2.10.0+cu130
      - torchvision==0.25.0+cu130
    source: /home/user/models/pi05_so101
    adapter_config: /home/user/.config/rlinf-deploy/pi05_so101_http_serve.json
    server:
      bind: 127.0.0.1
      port: 8000

runtimes:
  so101-1-runtime:
    robot: so101-1
    model: pi05-01
    binding: lerobot.so101.pi05
