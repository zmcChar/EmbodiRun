metadata:
  name: thor-dual-so101-pi05-example
  deploy-commit: xxx
  inference-commit: xxx

nodes:
  jetson-agx-thor-232:
    type: jetson.agx-thor-128gb
    connection:
      type: ssh
      host: 192.168.2.232
      port: 22
      username: operator
      password_env: JETSON_AGX_THOR_232_SSH_PASSWORD
      accept_new_host_key: false

robots:
  so101-1:
    type: lerobot.so101
    node: jetson-agx-thor-232
    port: /dev/ttyACM0
    calibration_id: so101-1
    calibration_dir: /path/to/lerobot/calibration
    disable_torque_on_disconnect: true
    max_joint_step_deg: 12.0
    max_gripper_step: 20.0

    sensors:
      camera-0:
        type: realsense
        serial: REPLACE_WITH_SO101_1_CAMERA_SERIAL
        width: 640
        height: 480
        fps: 30

  so101-2:
    type: lerobot.so101
    node: jetson-agx-thor-232
    port: /dev/ttyACM1
    calibration_id: so101-2
    calibration_dir: /path/to/lerobot/calibration
    disable_torque_on_disconnect: true
    max_joint_step_deg: 12.0
    max_gripper_step: 20.0

    sensors:
      camera-0:
        type: realsense
        serial: REPLACE_WITH_SO101_2_CAMERA_SERIAL
        width: 640
        height: 480
        fps: 30

models:
  pi05-01:
    backend: vvla
    transport: http
    type: pi05
    node: jetson-agx-thor-232
    gpu: cuda:0
    environment: .venv-vvla
    source: /path/to/pi05-so101-checkpoint
    adapter_config: configs/pi05_so101_http_serve.example.json
    server:
      bind: 0.0.0.0
      port: 8000

runtimes:
  so101-1-runtime:
    robot: so101-1
    model: pi05-01
    binding: lerobot.so101.pi05

  so101-2-runtime:
    robot: so101-2
    model: pi05-01
    binding: lerobot.so101.pi05
