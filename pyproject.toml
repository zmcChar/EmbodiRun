[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-runtime-prototype"
version = "0.1.0"
description = "Provisional prototype for model, engine, and heterogeneous backend contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Project contributors" }]
dependencies = [
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
torch = ["torch>=2.7"]
pi05 = [
  "lerobot[pi]==0.5.1",
  "safetensors>=0.4.3,<1",
]
smolvla = [
  "lerobot[smolvla]==0.3.3",
  "safetensors>=0.4.3,<1",
]
openvla_oft = [
  "huggingface-hub>=0.30",
  "safetensors>=0.4.3,<1",
  "timm>=0.9.10,<1.0.0",
  "torchvision",
  "transformers>=5,<6",
]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
  "openvla_oft: tests that require a real OpenVLA-OFT checkpoint",
  "pi05: tests that require a real LeRobot π0.5 checkpoint",
  "smolvla: tests that require a real LeRobot SmolVLA checkpoint",
  "gr00t_n17: tests that require the real NVIDIA GR00T N1.7 checkpoint",
]

[tool.ruff]
line-length = 100
target-version = "py310"
