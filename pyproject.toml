[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-deploy"
version = "0.1.0"
description = "Robot and simulator deployment clients for RLinf inference services"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
ssh = ["paramiko>=3.4,<5"]
fr3 = ["franky-control>=1.1.4,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
rlinf-go2-streamvln = "rlinf_deploy.bindings.unitree.go2.streamvln.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rlinf_deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
