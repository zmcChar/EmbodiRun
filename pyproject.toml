[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-deploy"
version = "0.1.0"
description = "Robot and simulator deployment clients for RLinf inference services"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
wireless = [
    "wireless-comm @ git+ssh://git@github.com/BUAA-CI-LAB/WirelessComm.git@da66e99d391d6e2ef76583aa973b03f9dc8b12d5",
]

[dependency-groups]
dev = [
    { include-group = "host" },
    "pytest>=8,<9",
]
host = [
    "paramiko>=3.4,<5",
    "PyYAML>=6,<7",
    "rich>=13,<15",
]
robot-so101 = ["lerobot[feetech]>=0.6,<0.7"]
robot-fr3 = ["franky-control>=1.1.4,<2"]
robot-go2 = []

[tool.uv]
required-version = ">=0.12.0,<0.13"
default-groups = ["dev"]

[tool.uv.dependency-groups]
robot-so101 = { requires-python = ">=3.12" }

[project.scripts]
rlinf-deploy = "rlinf_deploy.services.host.cli.cli:main"
rlinf-control-serve = "rlinf_deploy.services.control.server:main"
rlinf-go2-streamvln = "rlinf_deploy.bindings.unitree.go2.streamvln.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rlinf_deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
