name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CPU tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Run the CPU test suite
        run: uv run --frozen pytest -q

      - name: Check the public entry points
        run: |
          uv run --frozen embodirun --help
          uv run --frozen python -c "import embodirun, embodirun.client, embodirun.application, embodirun.deployment, embodirun.devices, embodirun.model_services"

  docs:
    name: Docs (strict)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the documentation
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict
