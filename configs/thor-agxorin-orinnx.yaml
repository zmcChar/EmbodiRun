  so101-2:
    type: lerobot.so101
    node: jetson-orin-nx
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C4C125310-if00
    calibration_id: orin_nx_so101_follower
    calibration_dir: /home/jetson/.cache/huggingface/lerobot/calibration/robots/so_follower
    disable_torque_on_disconnect: true
    max_joint_step_deg: 5.0
    max_gripper_step: 10.0
    step_limit_mode: clip

models:
  pi05-01:
    backend: vvla
    # The Orin NX control service sends observations to Thor through WirelessComm.
    transport: wireless
    type: pi05
    node: jetson-agx-thor-232
    gpu: cuda:0
    environment: .venv-vvla
    source: /home/user/models/pi05_so101
    comm_config: /home/user/.config/rlinf-deploy/thor-orin-nx-wireless.yaml
    client_comm_config: /home/jetson/.config/rlinf-deploy/thor-orin-nx-wireless.yaml
    server_node_id: inference-thor
    server:
      bind: 0.0.0.0
      port: 8000

