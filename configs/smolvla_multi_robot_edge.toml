# One real SmolVLA edge process. Start this template three times with distinct
# identity, physical-resource, and observation-seed CLI overrides.
# Pass concrete local model paths with --checkpoint and --vlm-base-path.

[identity]
robot_id = "robot-demo"
edge_node_id = "edge-demo"
session_id = "auto"
embodiment = "so100"
action_space_id = "smolvla-so100-actions-v1"
physical_host_id = "edge-host"
physical_resource_id = "gpu-local-0"

[edge_provider]
name = "edge-smolvla"
runtime = "local_backend"
model = "smolvla"
checkpoint = "/path/to/smolvla_base"
backend = "torch_cuda"
device = "cuda:0"
compile_mode = "eager"
dtype = "preserve"

[edge_provider.package_options]
vlm_base_path = "/path/to/SmolVLM2-500M-Video-Instruct"
stats_variant = "so100"
local_files_only = true
load_device = "cpu"

[edge_provider.engine]
max_queue_size = 4
max_batch_size = 1
max_wait_ms = 0.0

[cloud]
host = "localhost"
port = 18770
timeout_s = 600.0
registration_timeout_s = 2.0
reconnect_interval_s = 0.5

[coordination]
mode = "async_cloud_preferred"
cloud_request_timeout_s = 600.0
cloud_result_ttl_s = 300.0
max_cloud_sequence_lag = 100
# Keep a completed result available for later control ticks instead of
# continuously filling the deliberately slow CPU cloud queue.
cloud_submit_interval_s = 60.0

[observation]
mode = "adapter_synthetic"
seed = 0
language_length = 48

[demo]
ticks = 16
control_period_s = 1.0
# Optional logical outage for only this robot:
# disconnect_tick = 5
# reconnect_tick = 9
