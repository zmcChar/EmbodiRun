# Run this example on a Linux GPU workstation; replace model and dataset paths.
# Examples use ports 8000/8100: stop one before starting another, or change ports.
metadata:
  name: habitat-streamvln-vvla
  deploy-commit: 7c96609060e6da34fd5ba885e08aa47cd8d67427

nodes:
  workstation:
    type: workstation
    connection:
      type: local

simulators:
  habitat-01:
    type: habitat
    node: workstation
    # Prepare R2R-VLNCE episodes and their referenced scene assets beforehand.
    dataset: /data/datasets/R2R_VLNCE_v1-3_preprocessed/val_unseen/val_unseen.json.gz
    scenes_dir: /data/scene_datasets
    episode_id: "0" # Replace with an episode_id present in the selected dataset.
    max_episode_steps: 500
    success_distance_m: 3.0
    width: 640
    height: 480
    gpu_device_id: 0
    viewer: false # Set true only when the simulator node has a working display.

models:
  streamvln-01:
    backend: vvla
    transport: http
    type: streamvln
    node: workstation
    gpu: cuda:0
    environment: .venv-vvla-streamvln
    source: /data/models/streamvln
    server:
      bind: 127.0.0.1
      port: 8000

runtimes:
  habitat-streamvln-runtime:
    simulator: habitat-01
    model: streamvln-01
    binding: unitree.go2.streamvln
    server:
      bind: 127.0.0.1
      port: 8100
