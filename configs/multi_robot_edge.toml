[identity]
robot_id = "robot-demo"
edge_node_id = "edge-demo"
# "auto" creates a new episode/session UUID on each process start.
session_id = "auto"
embodiment = "toy-vector"
action_space_id = "toy-vector-actions-v1"
# These describe physical colocation; they are not logical node IDs.
physical_host_id = "edge-host"
physical_resource_id = "local-device-0"

[edge_provider]
name = "edge-local"
runtime = "local_backend"
model = "toy_single_forward"
checkpoint = ""
backend = "torch_cuda"
device = "cpu"
compile_mode = "eager"
dtype = "float32"

[edge_provider.adapter_options]
action_horizon = 2
action_dim = 3

[edge_provider.engine]
max_queue_size = 16
max_batch_size = 1
max_wait_ms = 0.0

[cloud]
host = "localhost"
port = 18770
timeout_s = 5.0
registration_timeout_s = 2.0
reconnect_interval_s = 0.25

[coordination]
mode = "async_cloud_preferred"
cloud_request_timeout_s = 5.0
cloud_result_ttl_s = 2.0
max_cloud_sequence_lag = 2
cloud_submit_interval_s = 0.0

[observation]
# Override this per robot so each logical machine produces a distinct stream.
offset = 0.0

[demo]
ticks = 8
control_period_s = 0.05
# Uncomment to exercise logical link isolation for one edge process.
# disconnect_tick = 4
# reconnect_tick = 6
