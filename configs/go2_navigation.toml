# One shared Python environment, with one heavy local model resident at a time.
[provider]
backend = "streamvln" # qwen, streamvln, or internvla

[qwen]
base_url = "http://127.0.0.1:15003/v1"
model = "qwen3.5-9b"

[streamvln]
repository = "/path/to/StreamVLN"
checkpoint = "/path/to/streamvln-real-world"
device = "cuda:0"
cuda_memory_fraction = 0.45
max_new_tokens = 64
local_files_only = true
warmup = true

[internvla]
repository = "/path/to/InternNav"
checkpoint = "/path/to/internvla-n1-dualvln"
variant = "dualvln"
device = "cuda:0"

[go2]
camera_url = "http://192.168.137.34:8081"
control_url = "http://192.168.137.34:8080"
control_hz = 10.0

[go2.follower]
max_abs_vx_mps = 0.65
max_abs_vy_mps = 0.35
max_abs_yaw_rate_rps = 0.8
position_tolerance_m = 0.08
yaw_tolerance_rad = 0.08
