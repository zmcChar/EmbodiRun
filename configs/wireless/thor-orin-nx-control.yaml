# WirelessComm endpoint used by the SO101 control service on Orin NX.
local:
  node_id: control-orin-nx
  host: 10.168.192.133
  bind_host: 0.0.0.0
  port: 9300

peers:
  - node_id: inference-thor
    host: 10.168.192.200
    port: 9300

# Match Thor's bounded queues and Wi-Fi pacing so both directions behave alike.
comm:
  max_peer_queued_messages: 16
  max_peer_queued_bytes: 67108864
  egress_quantum_bytes: 65536
  egress_rate_bytes_per_second: 6250000
  egress_burst_bytes: 65536
