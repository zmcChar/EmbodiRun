[service]
host = "127.0.0.1"
port = 18770
request_timeout_s = 30.0
max_sessions = 64
max_pending_per_session = 1
session_idle_ttl_s = 300.0
action_space_id = "toy-vector-actions-v1"
supported_embodiments = ["toy-vector"]
shutdown_grace_s = 5.0

[provider]
name = "shared-cloud"
runtime = "local_backend"
multi_tenant_safe = true
model = "toy_single_forward"
checkpoint = ""
backend = "torch_cuda"
device = "cpu"
compile_mode = "eager"
dtype = "float32"

[provider.adapter_options]
action_horizon = 2
action_dim = 3

[provider.engine]
max_queue_size = 128
# Keep untrusted sessions isolated until a model-owned batch compatibility key
# is available. Trusted, same-schema deployments may opt in explicitly.
max_batch_size = 1
max_wait_ms = 0.0
